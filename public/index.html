<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>갈릭폰 (GarlicPhone)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="toolbar">
      <div class="toolbar-top">
        <div class="tools-grid">
          <button id="btn-pen" class="tool-btn active" title="연필 (Pen)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
            <span class="tool-label">연필</span>
          </button>
          <button id="btn-eraser" class="tool-btn" title="지우개 (Eraser)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20"></path><line x1="18" y1="13" x2="11" y2="20"></line></svg>
            <span class="tool-label">지우개</span>
          </button>
          
          <button id="btn-fill" class="tool-btn" title="채우기 (Fill)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11z"></path><path d="M5 2l5 5"></path><path d="M2 13h15"></path><path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-3 2-3s2 1.4 2 3z"></path></svg>
            <span class="tool-label">채우기</span>
          </button>
          <button id="btn-square" class="tool-btn" title="네모 그리기 (Square)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
            <span class="tool-label">네모</span>
          </button>
          
          <button id="btn-undo" class="tool-btn" title="뒤로가기 (Undo)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
            <span class="tool-label">실행취소</span>
          </button>
          <button id="btn-redo" class="tool-btn" title="앞으로가기 (Redo)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
            <span class="tool-label">다시실행</span>
          </button>
          
          <button id="btn-picker" class="tool-btn" title="컬러픽커 (Color Picker)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l5.5-5.5"></path><path d="M15.5 2.5a2.828 2.828 0 1 1 4 4L7.5 18.5c-.3.3-.6.4-1 .4H3v-3.5c0-.4.1-.7.4-1L15.5 2.5z"></path></svg>
            <span class="tool-label">스포이드</span>
          </button>
          <button id="btn-clear" class="tool-btn" title="화면 초기화 (Clear)">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span class="tool-label">전체지우기</span>
          </button>
        </div>
        
        <div class="size-container">
          <input type="range" id="size-slider" class="vertical-slider" min="1" max="100" value="10" orient="vertical">
          <div class="size-indicator-wrapper">
            <div id="size-indicator" class="size-indicator"></div>
          </div>
        </div>
      </div>
      
      <div class="toolbar-bottom">
        <div class="palette-grid">
          <input type="color" id="current-color-picker" class="current-color-display" value="#000000" title="현재 색상 (사용자 정의 색상 선택)">
          <!-- Will be generated by JS or statically defined here -->
          <button class="color-btn active" data-color="#000000" style="background-color: #000000;"></button>
          <button class="color-btn" data-color="#555555" style="background-color: #555555;"></button>
          <button class="color-btn" data-color="#AAAAAA" style="background-color: #AAAAAA;"></button>
          <button class="color-btn" data-color="#FFFFFF" style="background-color: #FFFFFF;"></button>
          
          <button class="color-btn" data-color="#FF3B30" style="background-color: #FF3B30;"></button>
          <button class="color-btn" data-color="#FF9500" style="background-color: #FF9500;"></button>
          <button class="color-btn" data-color="#FFCC00" style="background-color: #FFCC00;"></button>
          <button class="color-btn" data-color="#4CD964" style="background-color: #4CD964;"></button>
          
          <button class="color-btn" data-color="#5AC8FA" style="background-color: #5AC8FA;"></button>
          <button class="color-btn" data-color="#007AFF" style="background-color: #007AFF;"></button>
          <button class="color-btn" data-color="#5856D6" style="background-color: #5856D6;"></button>
          <button class="color-btn" data-color="#FF2D55" style="background-color: #FF2D55;"></button>
          
          <button class="color-btn" data-color="#8B4513" style="background-color: #8B4513;"></button>
          <button class="color-btn" data-color="#D2691E" style="background-color: #D2691E;"></button>
          <button class="color-btn" data-color="#F4A460" style="background-color: #F4A460;"></button>
          <button class="color-btn" data-color="#FFE4B5" style="background-color: #FFE4B5;"></button>
        </div>
      </div>
    </header>
    
    <main class="canvas-container">
      <canvas id="drawing-canvas"></canvas>
    </main>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
